[package]
name = "codecrafters-redis"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
authors = ["Codecrafters <hello@codecrafters.io>"]

[dependencies]
# Exact pins. Each is the newest release whose rust-version fits this
# package's rust-version (the CodeCrafters buildpack, rust-1.96).

# Async runtime and utilities
tokio = { version = "=1.54.1", features = ["full"] }
tokio-util = { version = "=0.7.20", features = ["codec"] }
futures = "=0.3.34"
async-trait = "=0.1.92"

# Byte buffers
bytes = "=1.12.1"

# Command-line interface parsing
clap = { version = "=4.6.7", features = ["derive"] }

# Error handling
anyhow = "=1.0.104"
thiserror = "=2.0.21"

# Structured logging
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

# Enum <-> string conversion for command names
strum = "=0.28.0"
strum_macros = "=0.28.0"

# Concurrent keyspace map
dashmap = "=6.2.1"

# Total ordering for sorted-set scores
ordered-float = "=5.5.1"
